name: a-fabric-sonar

services:
  sonarqube:
    image: sonarqube@sha256:0b3408443fb6a311253de27941b10977c9b977fd53be2265947bfe14161308b8
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    mem_limit: 3g
    cpus: 2
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:9000/api/system/status | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli@sha256:47956b669bf486bdad919e1cbd0533223515aa0b6d1d31763e5a3754942df6d7
    profiles: [scanner]
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:?Set a local analysis token in .env}
    working_dir: /usr/src
    volumes:
      - ${QUALITY_SOURCE_PATH:?Quality snapshot path is required}:/usr/src:rw
    mem_limit: 2g
    cpus: 2

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
