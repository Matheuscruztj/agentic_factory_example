name: factory-quality
x-api: &api
  image: agentic-factory-quality:local
  build:
    context: ${QUALITY_SOURCE_PATH:-../..}
    dockerfile: infra/quality/Dockerfile
  labels:
    factory.quality.run_id: ${QUALITY_RUN_ID:?Quality run required}
    factory.quality.source_sha256: ${QUALITY_SOURCE_SHA256:?Source fingerprint required}
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 1g
  cpus: 1
  networks: [quality-targets, quality-access]
  depends_on:
    quality-postgres:
      condition: service_healthy
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
    interval: 3s
    timeout: 3s
    retries: 30
    start_period: 10s

services:
  quality-postgres:
    image: postgres@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_USER: quality
      POSTGRES_PASSWORD: ${QUALITY_DB_PASSWORD:?Use scripts/quality.py to initialize isolated credentials}
      POSTGRES_DB: factory
    ports: ["127.0.0.1:18832:5432"]
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,size=512m
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U quality -d factory]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [quality-targets, quality-access]
    mem_limit: 768m
    cpus: 1

  factory-api:
    <<: *api
    command: [python, scripts/quality_target.py, factory]
    ports: ["127.0.0.1:18801:8000"]
    environment:
      FACTORY_ENV: quality
      DATABASE_URL: postgresql+psycopg://quality:${QUALITY_DB_PASSWORD}@quality-postgres:5432/factory
      APP_SECRET_KEY: ${QUALITY_APP_SECRET:?Quality-only secret required}
      OPERATOR_PASSWORD_HASH: ${QUALITY_OPERATOR_HASH:?Quality-only password hash required}
      LOCAL_AUTH_ENABLED: "true"
      FACTORY_CORS_ORIGINS: http://127.0.0.1:18803
      REGISTRY_API_URL: http://registry-api:8000
      GITHUB_ENABLED: "false"
      TELEGRAM_ENABLED: "false"
      OPENBOT_ENABLED: "false"
      OLLAMA_ENABLED: "false"
      REDIS_ENABLED: "false"
      OTEL_ENABLED: "false"
      PHOENIX_ENABLED: "false"

  registry-api:
    <<: *api
    command: [python, scripts/quality_target.py, registry]
    ports: ["127.0.0.1:18810:8000"]
    environment:
      FACTORY_ENV: quality
      REGISTRY_DATABASE_URL: postgresql+psycopg://quality:${QUALITY_DB_PASSWORD}@quality-postgres:5432/customer_registry
      REGISTRY_CORS_ORIGINS: http://127.0.0.1:18804

  factory-web:
    image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    labels:
      factory.quality.run_id: ${QUALITY_RUN_ID:?Quality run required}
      factory.quality.source_sha256: ${QUALITY_SOURCE_SHA256:?Source fingerprint required}
    ports: ["127.0.0.1:18803:8080"]
    volumes:
      - ${QUALITY_FACTORY_DIST:-../../apps/factory-web/dist}:/usr/share/nginx/html:ro
      - ../quality/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [quality-targets, quality-access]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 3s
      timeout: 3s
      retries: 20

  registry-web:
    image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    labels:
      factory.quality.run_id: ${QUALITY_RUN_ID:?Quality run required}
      factory.quality.source_sha256: ${QUALITY_SOURCE_SHA256:?Source fingerprint required}
    ports: ["127.0.0.1:18804:8080"]
    volumes:
      - ${QUALITY_REGISTRY_DIST:-../../apps/customer-registry/web/dist}:/usr/share/nginx/html:ro
      - ../quality/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [quality-targets, quality-access]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 3s
      timeout: 3s
      retries: 20

  semgrep:
    image: semgrep/semgrep@sha256:3db5c7af55eb1f512eac0abf0ab69a97b52c74b5e9a27314c221aee1a78d7ab2
    profiles: [sast]
    network_mode: none
    working_dir: /src
    volumes:
      - ${QUALITY_SOURCE_PATH:?Sanitized snapshot required}:/src:ro
    environment:
      HOME: /tmp/home
      XDG_CACHE_HOME: /tmp/cache
    read_only: true
    tmpfs: [/tmp]
    entrypoint: [semgrep, scan]
    command: [--config, /src/infra/security/semgrep.yml, --metrics=off, --disable-version-check, --strict, --error, --json, --exclude, "**/tests/**", apps, packages, workers, scripts]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2

  zap:
    image: zaproxy/zap-stable@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
    profiles: [dast]
    networks: [quality-targets]
    volumes:
      - ${QUALITY_DAST_DIR:-../../.runtime/quality/extended}:/zap/wrk:rw
      - ${QUALITY_AUTH_DIR:-../../.runtime/quality/private}:/zap/auth:ro
      - ../quality/zap_hooks.py:/opt/quality/zap_hooks.py:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    entrypoint: [zap-baseline.py]
    command: [-t, http://factory-web:8080/, -m, "1", -I, -J, factory-web.json, -r, factory-web.html]

  sonarqube:
    image: sonarqube@sha256:0b3408443fb6a311253de27941b10977c9b977fd53be2265947bfe14161308b8
    profiles: [sonar]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes: [sonar_data:/opt/sonarqube/data, sonar_extensions:/opt/sonarqube/extensions, sonar_logs:/opt/sonarqube/logs]
    networks: [quality-targets]
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    mem_limit: 3g
    cpus: 2
    ulimits:
      nofile: {soft: 65536, hard: 65536}

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli@sha256:47956b669bf486bdad919e1cbd0533223515aa0b6d1d31763e5a3754942df6d7
    profiles: [sonar]
    networks: [quality-targets]
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    working_dir: /usr/src
    volumes: ["${QUALITY_SOURCE_PATH:?Sanitized snapshot required}:/usr/src:rw"]

networks:
  quality-access:
  quality-targets:
    internal: true

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
