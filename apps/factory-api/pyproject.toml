[project]
name = "factory-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic[email]>=2.8,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1", "agent-runtime", "context-engine", "task-engine"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
agent-runtime = { workspace = true }
context-engine = { workspace = true }
task-engine = { workspace = true }
