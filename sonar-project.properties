sonar.projectKey=agentic-factory-local
sonar.projectName=Agentic Factory Local
sonar.sources=apps,packages,scripts,workers
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/.runtime/**,**/.venv/**,**/dist/**,**/__pycache__/**
sonar.coverage.exclusions=**/tests/**,**/e2e/**,**/*.test.ts,**/*.spec.ts,**/alembic/**,scripts/**,apps/*/web/src/**
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=sonar-reports/python-coverage.xml
sonar.javascript.lcov.reportPaths=sonar-reports/factory-web-coverage.lcov,sonar-reports/registry-web-coverage.lcov
