[project]
name = "factory-workers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["agent-runtime[langgraph]", "context-engine", "eval-engine", "factory-api", "factory-integrations", "observability", "shared-contracts", "sqlalchemy>=2.0,<3", "task-engine"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_workers"]

[tool.uv.sources]
agent-runtime = { workspace = true }
context-engine = { workspace = true }
eval-engine = { workspace = true }
factory-api = { workspace = true }
factory-integrations = { workspace = true }
shared-contracts = { workspace = true }
observability = { workspace = true }
task-engine = { workspace = true }
